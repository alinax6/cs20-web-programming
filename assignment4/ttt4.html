<html>
    <head>
        <title>tic tac toe </title>

        <style>
            * {
                justify-content: center;
                text-align: center;
            }
            .board {
                display: grid;
                grid-template-columns: repeat(3, 100px);
                grid-template-rows: repeat(3, 100px);
                gap: 5px;
            }

            .square {
                width: 100px;
                height: 100px;
                background: #ffffff;
                border: 1px solid black;

                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 60px;
            }

            .square:hover {
                background: #dedede;
            }

            .turn {
                display: inline-block;
                border: 2px solid black;
                padding: 15px 30px;
                margin-bottom: 30px;
                margin-top: 30px;
                font-size: 24px;
            }

            .winner {
                display: inline-block;
                border: 2px solid black;
                padding: 15px 30px;
                margin-top: 30px;
                font-size: 24px;
            }

        </style>
    </head>

    <body>
        <h1>Tic Tac Toe</h1>
        <button id="startGame">Start New Game</button> <br>
        <div class="turn"></div>
        <div class="board">
            <script>
                const NUM_SQUARES = 9;
                for (let i=0; i<NUM_SQUARES; i++)
                {
                    id = "sq"+i;
                   
                    document.write( "<div class='square' id='" + id +"'></div>" );
                }
            </script>
        </div>

        <div class="winner"></div> 
        <script>
            const squares = document.querySelectorAll(".square")
                const winnerDiv = document.querySelector(".winner");
                for (let i = 0; i < squares.length; i++) {
                    squares[i].addEventListener("click", clickSquare);
                }

                const turns = document.querySelector(".turn");
                let currentPlayer = Math.random() < 0.5 ? "X" : "O";
                turns.textContent = currentPlayer + "'s turn";
                let endGame = false;

                function clickSquare() {
                    if (endGame == true) {
                        return;
                    }
                    let clickedSquare = this;

                    if (clickedSquare.textContent == "X" || clickedSquare.textContent == "O") {
                        return;
                    }
                    clickedSquare.textContent = currentPlayer;
                    
                    if (currentPlayer == "X") {
                        currentPlayer = "O";
                    }
                    else {
                        currentPlayer = "X";
                    }
                    turns.textContent = currentPlayer + "'s turn";

                    let moves = [];
                    squares.forEach((square) => {
                        if (square.innerText == "") {
                            moves.push("-");
                        }
                        else {
                            moves.push(square.innerText);
                        }
                    })

                    console.log("moves: " + moves);

                    let winConditions = [];
                    winConditions.push(moves[0] + moves[1] + moves[2]);
                    winConditions.push(moves[3] + moves[4] + moves[5]);
                    winConditions.push(moves[6] + moves[7] + moves[8]);
                    winConditions.push(moves[0] + moves[3] + moves[6]);
                    winConditions.push(moves[1] + moves[4] + moves[7]);
                    winConditions.push(moves[2] + moves[5] + moves[8]);
                    winConditions.push(moves[0] + moves[4] + moves[8]);
                    winConditions.push(moves[2] + moves[4] + moves[6]);

                    let winner = "";
                    for (let i = 0; i < winConditions.length; i++) {
                        if (winConditions[i] == "XXX") {
                            winner = "X"
                        }
                        else if (winConditions[i] == "OOO") {
                            winner = "O";
                        }
                    }

                    let stalemate = false;
                    if (winner == "" && !moves.includes("-")) {
                        stalemate = true;
                    }

                    console.log("winConditions: " + winConditions);

                    if (winner != "") {
                        winnerDiv.textContent = winner + " wins! Game Over!"; 
                        endGame = true;
                        return;
                    }
                    else if (stalemate) {
                        winnerDiv.textContent = "Stalemate! Game Over!";
                        endGame = true;
                        return;
                    }
                }


                let startButton = document.getElementById("startGame");
                startButton.addEventListener("click", startGame);

                function startGame() {
                    endGame = false;
                    winnerDiv.textContent = "";
                    for (let i = 0; i < squares.length; i++) {
                        squares[i].textContent = "";
                    } 

                    currentPlayer = Math.random() < 0.5 ? "X" : "O";
                    turns.textContent = currentPlayer + "'s turn";
                }
        </script>

    </body>
</html>
