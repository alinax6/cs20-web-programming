<html>
    <head>
        <title>tic tac toe </title>

        <style>
            * {
                justify-content: center;
                text-align: center;
            }
            .board {
                display: grid;
                grid-template-columns: repeat(3, 100px);
                grid-template-rows: repeat(3, 100px);
                gap: 5px;
            }

            .square {
                width: 100px;
                height: 100px;
                background: #ffffff;
                border: 1px solid black;

                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 60px;
            }

            .square:hover {
                background: #dedede;
            }

            .turn {
                display: inline-block;
                border: 2px solid black;
                padding: 15px 30px;
                margin-bottom: 30px;
                margin-top: 30px;
                font-size: 24px;
            }

            .winner {
                display: inline-block;
                border: 2px solid black;
                padding: 15px 30px;
                margin-top: 30px;
                font-size: 24px;
            }

        </style>
    </head>

    <body>
        <h1>Tic Tac Toe</h1>
        <button id="startGame">Start Game</button> <br>
        <div class="turn"></div>
        <div class="board">
            <script>
                const NUM_SQUARES = 9;
                for (i=0; i<NUM_SQUARES; i++)
                {
                    id = "sq"+i;
                   
                    document.write( "<div class='square' id='" + id +"'></div>" );
                }
            </script>
        </div>
        <div class="winner">Winner</div>
        <script>
            const squares = document.querySelectorAll(".square")
            for (let i = 0; i < squares.length; i++) {
                squares[i].addEventListener("click", clickSquare);
            }

            const turns = document.querySelector(".turn");
            let currentPlayer = Math.random() < 0.5 ? "X" : "O";
            turns.textContent = currentPlayer + "'s turn";

            function clickSquare() {
                let clickedSquare = this;
                let squareNumber = clickedSquare.id;
                alert(squareNumber);

                if (clickedSquare.textContent == "X" || clickedSquare.textContent == "O") {
                    return;
                }
                clickedSquare.textContent = currentPlayer;
                
                if (currentPlayer == "X") {
                    currentPlayer = "O";
                }
                else {
                    currentPlayer = "X";
                }
                turns.textContent = currentPlayer + "'s turn";
            }

            let startButton = document.getElementById("startGame");
            startButton.addEventListener("click", startGame);

            function startGame() {
                for (let i = 0; i < squares.length; i++) {
                    squares[i].textContent = "";
                } 

                currentPlayer = Math.random() < 0.5 ? "X" : "O";
            }
        </script>
    </body>
</html>
