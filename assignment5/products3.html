<html>
    <head>
        <title>products</title>
        <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>

        <style>
            body {
                margin: 0;
                padding: 0;
                text-align: center;
            }

            h1 {
                margin-top: 30px;
            }

            select, button {
                padding: 8px 12px;
                margin: 10px;
                font-size: 14px;
            }

            #result {
                display: grid;
                gap: 20px;
                padding-bottom: 60px;
                padding-top: 20px;
            }


        </style>
    </head>

    <body>
        <h1>Filter Products</h1>

        <select id="categorySelect"></select>
        <button id="filterBtn">Filter</button>
        <div id="result"></div>

        <script>
            let allProducts = [];

            $(document).ready(function() {
                $.get("products.json", function(data) {
                    allProducts = data.productlist;
                    let categoriesSet = new Set ();

                    for (let i = 0; i < allProducts.length; i++) {
                        let productCategories = allProducts[i].Categories;

                        for (let j = 0; j < productCategories.length; j++) {
                            categoriesSet.add(productCategories[j]);
                        }
                    }

                    let select = document.getElementById("categorySelect");

                    categoriesSet.forEach(function(category) {
                        let option = document.createElement("option");
                        option.value = category;
                        option.textContent = category;
                        select.appendChild(option);
                    });
                });
            });

            $("#filterBtn").click(function() {
                let selectedCategory = $("#categorySelect").val();
                let output = "";

                for (let i = 0; i < allProducts.length; i++) {
                    if (allProducts[i].Categories.includes(selectedCategory)) {
                        output += `<div class="product-name">${allProducts[i].Name}</div>`;
                    }
                }

                document.getElementById("result").innerHTML = output;
            });
        </script>
    </body>
</html>
